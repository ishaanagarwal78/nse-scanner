name: Market-hours scanner
run-name: ${{ github.event.inputs.slot || (github.event.schedule == '55 2 * * 1-5' && 'morning') || (github.event.schedule == '25 7 * * 1-5' && 'afternoon') || (github.event.schedule == '45 13 * * 1-5' && 'evening') || github.event.inputs.mode }}

on:
  schedule:
    - cron: "55 2 * * 1-5"   # 08:25 IST Mon-Fri: 8:30 brief, pre-open, morning session until 13:00 IST
    - cron: "25 7 * * 1-5"   # 12:55 IST Mon-Fri: afternoon session until 18:50 IST (post-market results included)
    - cron: "45 13 * * 1-5"  # 19:15 IST Mon-Fri: evening reports (money flows, insiders, shareholding)
  workflow_dispatch:
    inputs:
      mode:
        description: "session, backfill, evening or relay"
        default: backfill
      slot:
        description: "morning, afternoon, evening or relay (used by the run chain; leave empty for a one-off run)"
        default: ""
      date:
        description: "backfill date (YYYY-MM-DD or YYYY-MM-DD:YYYY-MM-DD)"
        default: ""
      start:
        description: "wait until this time IST before starting (HH:MM)"
        default: ""
      until:
        description: "session end time IST (HH:MM)"
        default: "15:40"
      opening:
        description: "send the morning brief and overnight digest (yes/no)"
        default: "no"

concurrency:
  group: scanner-${{ github.event.inputs.slot || (github.event.schedule == '55 2 * * 1-5' && 'morning') || (github.event.schedule == '25 7 * * 1-5' && 'afternoon') || (github.event.schedule == '45 13 * * 1-5' && 'evening') || github.event.inputs.mode }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      ALERTS_LIVE: ${{ vars.ALERTS_LIVE }}
      PRICE_ALERTS_LIVE: ${{ vars.PRICE_ALERTS_LIVE }}
      PREVIEW_CHAT: ${{ vars.PREVIEW_CHAT }}
      GITHUB_TOKEN: ${{ github.token }}
      SLOT: ${{ github.event.inputs.slot || (github.event.schedule == '55 2 * * 1-5' && 'morning') || (github.event.schedule == '25 7 * * 1-5' && 'afternoon') || (github.event.schedule == '45 13 * * 1-5' && 'evening') || '' }}
      START: ${{ github.event.inputs.start }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Skip if this slot already ran today
        id: guard
        if: env.SLOT != '' && env.SLOT != 'relay'
        run: python -m scanner.chain done "$SLOT" && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"
      - name: Morning session
        if: env.SLOT == 'morning' && steps.guard.outputs.go == '1'
        run: python -m scanner.run --start "${START:-08:25}" --until 13:00
      - name: Afternoon session
        if: env.SLOT == 'afternoon' && steps.guard.outputs.go == '1'
        run: python -m scanner.run --start "${START:-12:55}" --until 18:50 --no-opening
      - name: Evening reports
        if: env.SLOT == 'evening' && steps.guard.outputs.go == '1'
        run: python -m scanner.run --start "${START:-19:15}" --evening
      - name: Relay toward the next morning
        if: env.SLOT == 'relay'
        run: python -m scanner.chain relay
      - name: One-off manual run
        if: github.event_name == 'workflow_dispatch' && env.SLOT == ''
        run: |
          if [ "${{ github.event.inputs.mode }}" = "session" ]; then
            if [ "${{ github.event.inputs.opening }}" = "yes" ]; then
              python -m scanner.run --start "${START:-00:00}" --until "${{ github.event.inputs.until }}"
            else
              python -m scanner.run --start "${START:-00:00}" --until "${{ github.event.inputs.until }}" --no-opening
            fi
          elif [ "${{ github.event.inputs.mode }}" = "evening" ]; then
            python -m scanner.run --evening
          else
            python -m scanner.run --backfill "${{ github.event.inputs.date || '2026-10-08' }}"
          fi
      - name: Start the next run
        if: always() && env.SLOT != '' && env.SLOT != 'relay'
        run: python -m scanner.chain next "$SLOT"
      - name: Keep the day's price data
        if: always() && hashFiles('stream_data/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prices-${{ github.run_id }}
          path: stream_data/
          retention-days: 90
